<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #eeeeee;
        }

        .box {
            width: 329px;
            height: 405px;

            border: 2px solid #888;
            background-color: #9fc5e5;

            padding: 3px;
        }

        .input {
            width: 100%;
            height: 74px;

            font-size: 22px;
            padding: 10px;

            border: 1px solid #777;
            outline: none;
        }

        .buttons_box {
            width: 100%;
            height: 320px;

            display: flex;
            flex-direction: column;
        }

        .buttons_row {
            width: 100%;
            height: 64px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        .btns {
            width: 100%;
            height: 64px;

            border: 1px solid #777;
            background-color: #9fc5e5;

            font-size: 22px;
            cursor: pointer;
        }

        .btns:hover {
            background-color: #8bb6d9;
        }

        .btns_:hover {
            background-color: #8bb6d9;
        }

        .btns_:active,
        .btns:active {
            background-color: #75a5cc;
        }
        .btnse{
              width: 100%;
            height: 64px;

            border: 1px solid #777;
            background-color: #9fc5e5;

            font-size: 22px;
            cursor: pointer;

        }
        .btns:hover{

            background-color: #8bb6d9;

        }
        .btnse:active{
     background-color: #75a5cc;

        }
        
    </style>

</head>

<body>

    <div class="box">

        <div>
            <input
                class="input"
                id="calc"
                type="text"
                placeholder="Enter calculation"
            >
        </div>


      <div class="buttons_box">

    <div class="buttons_row">

        <button class="btns" id="btnss">7</button>
        <button class="btns" id="btnss">8</button>
        <button class="btns" id="btnss">9</button>
        <button class="btns" id="btnss">/</button>

    </div>


    <div class="buttons_row">

        <button class="btns" id="btnss">4</button>
        <button class="btns" id="btnss">5</button>
        <button class="btns" id="btnss">6</button>
        <button class="btns" id="btnss">*</button>

    </div>


    <div class="buttons_row">

        <button class="btns" id="btnss">1</button>
        <button class="btns" id="btnss">2</button>
        <button class="btns" id="btnss">3</button>
        <button class="btns" id="btnss">-</button>

    </div>


    <div class="buttons_row">

        <button class="btns" id="btnss">0</button>
        <button class="btns" id="btnss">.</button>
        <button class="btns" id="btnss">+</button>
        <button class="btnse" id="btns=">=</button>

    </div>

        </div>

    </div>
      

   

</body>


 <script>

        document.getElementById("calc").addEventListener("input", function () {

            this.value = this.value.replace(/[^0-9+\-*/().]/g, "");

        });


       let buttons = document.querySelectorAll(".btns");

buttons.forEach(function(button) {

    button.addEventListener("click", function() {

        var x = button.innerText;

        document.getElementById("calc").value += x;

    });

});
      var ff = 0
    var f = document.getElementById("calc").value
    
    document.getElementById("btns=").addEventListener("click",function (){
        var f = document.getElementById("calc").value
        ff= eval(f)
        
        document.getElementById("calc").value = ff


        
    })


    </script>

</html>
